# Journal sans query string : les filtres staff peuvent contenir des données personnelles.
log_format ltnm_without_args
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

map $uri $ltnm_cache_control {
    default "";
    ~^/(admin|operations)(/|$) "no-store";
}

server {
    listen 80;
    listen [::]:80;
    server_name resa-ltnfm.agrobio-bretagne.org;

    server_tokens off;
    client_max_body_size 5m;

    access_log /var/log/nginx/resa-ltnfm.access.log ltnm_without_args;
    error_log /var/log/nginx/resa-ltnfm.error.log warn;

    location ^~ /media/ {
        alias /opt/resa-ltnfm/var/media/;
        autoindex off;
        disable_symlinks on;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    # La readiness sollicite PostgreSQL et Redis : elle reste interne au serveur.
    location = /readyz/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Le proxy écrase les valeurs fournies par le client.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 10s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;

        add_header Cache-Control $ltnm_cache_control always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
