name: ${COMPOSE_PROJECT_NAME:-ltnm_resa}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-db.sh:/docker-entrypoint-initdb.d/10-init-app-db.sh:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql --no-password -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc 'SELECT 1'
          | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    logging: *default-logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --loglevel
      - warning
      - --maxmemory
      - ${REDIS_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.50}
    logging: *default-logging

  web:
    image: ltnm-reservations:${APP_RELEASE:?APP_RELEASE required}
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-10001}
    restart: unless-stopped
    init: true
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-3}
      - --timeout=${GUNICORN_TIMEOUT:-300}
      - --graceful-timeout=30
      - --max-requests=${GUNICORN_MAX_REQUESTS:-1000}
      - --max-requests-jitter=100
      - --access-logfile=-
      - '--access-logformat=%(t)s "%(m)s %(U)s %(H)s" %(s)s %(b)s %(L)s'
      - --error-logfile=-
      - --capture-output
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-resa-ltnfm.agrobio-bretagne.org}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS required}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-1}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-1}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
      ENABLE_LEGACY_PUBLIC_FLOW: ${ENABLE_LEGACY_PUBLIC_FLOW:-0}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD required}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-5}
      REDIS_URL: redis://redis:6379/0
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-ltnm_resa}
      EMAIL_BACKEND: ${EMAIL_BACKEND:?EMAIL_BACKEND required}
      EMAIL_HOST: ${EMAIL_HOST:?EMAIL_HOST required}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL required}
      ORGANIZATION_EMAIL: ${ORGANIZATION_EMAIL:?ORGANIZATION_EMAIL required}
      ORGANIZATION_PHONE: ${ORGANIZATION_PHONE:-}
      EVENT_DATES: ${EVENT_DATES:-2026-09-23,2026-09-24}
      REGISTRATION_EDIT_DEADLINE: ${REGISTRATION_EDIT_DEADLINE:-2026-09-16T23:59:00+02:00}
      DRAFT_HOLD_MINUTES: ${DRAFT_HOLD_MINUTES:-60}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-730}
      MANAGEMENT_SESSION_SECONDS: ${MANAGEMENT_SESSION_SECONDS:-3600}
    volumes:
      - type: bind
        source: ./var/media
        target: /app/media
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-18001}:8000"
    networks:
      - default
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/readyz/',
          headers={'Host': '$${APP_DOMAIN}', 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=5).read()"
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 300
    mem_limit: ${WEB_MEMORY_LIMIT:-768m}
    cpus: ${WEB_CPU_LIMIT:-1.0}
    stop_grace_period: 45s
    logging: *default-logging

networks:
  backend:
    internal: true

volumes:
  postgres_data:
