[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ltnm-reservations"
version = "0.1.0"
description = "Inscriptions des groupes scolaires au salon La Terre est Notre Métier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
    "Pillow>=11,<12",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
    "django-redis>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "venv",
    "staticfiles",
    "media",
    "var",
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]
