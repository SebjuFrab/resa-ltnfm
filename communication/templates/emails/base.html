<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}La Terre est Notre Métier{% endblock %}</title>
  <style>
    @media only screen and (max-width: 620px) {
      .email-shell { width: 100% !important; }
      .email-pad { padding-right: 20px !important; padding-left: 20px !important; }
      .summary-label { width: 36% !important; }
      .group-table { font-size: 11px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f4f2ea;color:#2f3032;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
    {% block preheader %}Informations de La Terre est Notre Métier.{% endblock %}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f4f2ea;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" class="email-shell" style="width:100%;max-width:640px;background:#ffffff;border-radius:12px;box-shadow:0 8px 28px rgba(47,48,50,.12);">
          <tr>
            <td>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="58%" height="8" style="height:8px;background:#f3b709;font-size:0;line-height:0;">&nbsp;</td>
                  <td width="24%" height="8" style="height:8px;background:#14ad88;font-size:0;line-height:0;">&nbsp;</td>
                  <td width="18%" height="8" style="height:8px;background:#ea5433;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 30px 12px;background:#ffffff;">
              <img src="cid:ltnfm-logo" width="250" alt="La Terre est Notre Métier" style="display:block;width:250px;max-width:80%;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td class="email-pad" style="padding:18px 30px 28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td class="email-pad" style="padding:24px 30px;background:#2f3032;color:#ffffff;border-radius:0 0 12px 12px;">
              <p style="margin:0 0 6px;color:#f3b709;font-size:12px;font-weight:800;text-transform:uppercase;">Une question sur le salon ?</p>
              <p style="margin:0;color:#ffffff;font-size:13px;line-height:1.6;"><a href="mailto:{{ organization_email }}" style="color:#ffffff;text-decoration:underline;">{{ organization_email }}</a>{% if organization_phone %} · {{ organization_phone }}{% endif %}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
