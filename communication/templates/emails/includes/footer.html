<tr>
  <td class="email-pad" style="padding:24px 30px;background:#2f3032;color:#ffffff;border-radius:0 0 12px 12px;">
    <p style="margin:0 0 6px;color:#f3b709;font-size:12px;font-weight:800;text-transform:uppercase;">Votre contact pour le salon</p>
    {% if sender_contact.name %}<p style="margin:0 0 4px;color:#ffffff;font-size:14px;font-weight:700;">{{ sender_contact.name }}</p>{% endif %}
    <p style="margin:0;color:#ffffff;font-size:13px;line-height:1.6;"><a href="mailto:{{ sender_contact.email }}" style="color:#ffffff;text-decoration:underline;">{{ sender_contact.email }}</a>{% if sender_contact.phone %} · {{ sender_contact.phone }}{% endif %}</p>
  </td>
</tr>
